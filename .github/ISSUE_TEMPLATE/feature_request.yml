name: Feature request
description: Propose a focused improvement to Alba
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: How should it work?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Examples or evidence
      description: Remove personal information from screenshots and samples.
