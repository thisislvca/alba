name: Bug report
description: Report a reproducible problem
title: "bug: "
body:
  - type: markdown
    attributes:
      value: Do not include Apple Account details, cookies, tokens, session files, filenames or personal photos. Report security problems through private vulnerability reporting.
  - type: input
    id: version
    attributes:
      label: Alba version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 8, Android 16
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
