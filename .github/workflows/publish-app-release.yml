name: Publish tested app

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tested candidate tag, for example app/v0.2.0-build.1001'
        required: true
        type: string
      notes:
        description: 'Final release notes; leave empty to reuse the prepared notes'
        type: string

permissions:
  contents: read

concurrency:
  group: app-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'thisislvca/alba' && github.ref == 'refs/heads/main'
    name: Promote the tested build to production
    environment: play-production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: read
      id-token: write
    env:
      APP_RELEASE_TAG: ${{ inputs.release_tag }}
      APP_NOTES: ${{ inputs.notes }}
      GH_TOKEN: ${{ github.token }}
      FASTLANE_SKIP_UPDATE_CHECK: 'true'
      FASTLANE_HIDE_CHANGELOG: 'true'
      FASTLANE_OPT_OUT_USAGE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify candidate source, hashes, certificate and GitHub provenance
        run: node scripts/release/release.mjs verify
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Authenticate to Google with short-lived credentials
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          project_id: lvca-alba-releases
          create_credentials_file: true
      - name: Promote the existing internal build
        run: bundle exec fastlane android production
      - name: Publish the GitHub release
        run: gh release edit "$APP_RELEASE_TAG" --repo thisislvca/alba --draft=false --prerelease=false --latest --notes-file .artifacts/release/metadata/en-US/changelogs/*.txt
