name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build, unit tests and lint
    if: github.repository != 'thisislvca/mela-archive'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MELA_SENTRY_DSN: ''
      MELA_SENTRY_PROPERTIES: /tmp/mela-ci-no-sentry.properties
      MELA_SIGNING_PROPERTIES: /tmp/mela-ci-no-signing.properties
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Check notices and scripts
        run: |
          cmp THIRD_PARTY_NOTICES.md app/src/main/res/raw/third_party_notices.txt
          bun test scripts/
          bash -n scripts/*.sh
      - name: Build, test and lint
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :engine:assembleDebugAndroidTest :protocol-icloud-web:assembleDebugAndroidTest testDebugUnitTest lintDebug :app:assembleRelease :benchmark:assembleBenchmark :benchmark:assembleProfile --no-daemon --console=plain

  instrumentation:
    name: Android ${{ matrix.api }} device tests
    if: github.repository != 'thisislvca/mela-archive'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    env:
      MELA_SENTRY_DSN: ''
      MELA_SENTRY_PROPERTIES: /tmp/mela-ci-no-sentry.properties
      MELA_SIGNING_PROPERTIES: /tmp/mela-ci-no-signing.properties
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools emulator platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Build test APKs before starting emulators
        run: >-
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
          :engine:assembleDebugAndroidTest :protocol-icloud-web:assembleDebugAndroidTest
          --max-workers=2 --no-parallel --no-daemon --console=plain
      - name: Run device tests
        run: |
          result=0
          for module in app engine protocol-icloud-web; do
            ./gradlew ":${module}:pixel2Api${{ matrix.api }}DebugAndroidTest" \
              -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
              -Pandroid.experimental.testOptions.managedDevices.maxConcurrentDevices=1 \
              --max-workers=2 --no-parallel --no-daemon --console=plain || result=1
          done
          exit "$result"
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-device-tests-${{ matrix.api }}
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          retention-days: 7

  checks:
    name: Android checks
    if: always() && github.repository != 'thisislvca/mela-archive'
    needs: [android, instrumentation]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all checks
        env:
          BUILD_RESULT: ${{ needs.android.result }}
          DEVICE_RESULT: ${{ needs.instrumentation.result }}
        run: test "$BUILD_RESULT" = success && test "$DEVICE_RESULT" = success
