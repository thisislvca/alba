name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build, unit tests and lint
    if: github.repository != 'thisislvca/mela-archive'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ALBA_SENTRY_DSN: ''
      ALBA_SENTRY_PROPERTIES: /tmp/alba-ci-no-sentry.properties
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Check notices and scripts
        run: |
          cmp THIRD_PARTY_NOTICES.md app/src/main/res/raw/third_party_notices.txt
          node --test 'scripts/**/*.test.mjs'
          bash -n scripts/*.sh
      - name: Build, test and lint
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :engine:assembleDebugAndroidTest :protocol-icloud-web:assembleDebugAndroidTest testDebugUnitTest lintDebug :app:assembleRelease :benchmark:assembleBenchmark :benchmark:assembleProfile --no-daemon --console=plain
      - name: Static analysis
        if: ${{ !cancelled() }}
        run: ./gradlew detekt ktlintCheck --no-daemon --console=plain

  instrumentation:
    name: Android ${{ matrix.api }} device tests
    if: github.repository != 'thisislvca/mela-archive'
    runs-on: ubuntu-24.04
    # The test orchestrator starts a fresh instrumentation for each test, which adds a few minutes per API level.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    env:
      ALBA_SENTRY_DSN: ''
      ALBA_SENTRY_PROPERTIES: /tmp/alba-ci-no-sentry.properties
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools emulator platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Build test APKs before starting emulators
        id: build-test-apks
        run: >-
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
          :engine:assembleDebugAndroidTest :protocol-icloud-web:assembleDebugAndroidTest
          --max-workers=2 --no-parallel --no-daemon --console=plain
      # Each module runs in its own step so a failure or hang is attributed to it.
      # Later modules still run after an earlier one fails; any failed step fails the job.
      - name: Run app device tests
        if: ${{ !cancelled() && steps.build-test-apks.outcome == 'success' }}
        run: >-
          ./gradlew ":app:pixel9Api${{ matrix.api }}DebugAndroidTest"
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.experimental.testOptions.managedDevices.maxConcurrentDevices=1
          --max-workers=2 --no-parallel --no-daemon --console=plain
      - name: Run engine device tests
        if: ${{ !cancelled() && steps.build-test-apks.outcome == 'success' }}
        run: >-
          ./gradlew ":engine:pixel9Api${{ matrix.api }}DebugAndroidTest"
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.experimental.testOptions.managedDevices.maxConcurrentDevices=1
          --max-workers=2 --no-parallel --no-daemon --console=plain
      - name: Run protocol-icloud-web device tests
        if: ${{ !cancelled() && steps.build-test-apks.outcome == 'success' }}
        run: >-
          ./gradlew ":protocol-icloud-web:pixel9Api${{ matrix.api }}DebugAndroidTest"
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.experimental.testOptions.managedDevices.maxConcurrentDevices=1
          --max-workers=2 --no-parallel --no-daemon --console=plain
      - name: Summarize device tests
        if: always()
        run: >-
          find . -path '*/build/outputs/androidTest-results/managedDevice/*' -name 'TEST-*.xml' -print0
          | xargs -0 node scripts/device_test_summary.mjs "Android ${{ matrix.api }} device tests" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-device-tests-${{ matrix.api }}
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
            **/build/intermediates/managed_device_android_test_additional_output/
          retention-days: 7

  checks:
    name: Android checks
    if: always() && github.repository != 'thisislvca/mela-archive'
    needs: [android, instrumentation]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all checks
        env:
          BUILD_RESULT: ${{ needs.android.result }}
          DEVICE_RESULT: ${{ needs.instrumentation.result }}
        run: test "$BUILD_RESULT" = success && test "$DEVICE_RESULT" = success
