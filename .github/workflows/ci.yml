name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, so the full device suite, the minSdk device and the compact phone still cover main between merges.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      record-screenshots:
        description: Record the screenshot goldens on Linux and commit them to this branch
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # The event is part of the key so a nightly run and a push to main do not cancel each other.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    # JVM tests: plain unit tests, Robolectric UI tests and the Roborazzi screenshot goldens, plus the builds and checks.
    name: Build, JVM tests and lint
    if: github.repository != 'thisislvca/mela-archive' && !inputs.record-screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ALBA_SENTRY_DSN: ''
      ALBA_SENTRY_PROPERTIES: /tmp/alba-ci-no-sentry.properties
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Check notices and scripts
        run: |
          cmp THIRD_PARTY_NOTICES.md app/src/main/res/raw/third_party_notices.txt
          node --test 'scripts/**/*.test.mjs'
          bash -n scripts/*.sh
      # Goldens are verified when they exist. Without any (the first run after adding screenshot tests), this run
      # records them for review and fails until they are committed.
      - name: Choose the screenshot mode
        id: screenshots
        run: |
          if find app/src/test/screenshots -name '*.png' 2>/dev/null | grep -q .; then
            echo "mode=verify" >> "$GITHUB_OUTPUT"
          else
            echo "mode=record" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and JVM tests
        id: build
        run: >-
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :engine:assembleDebugAndroidTest
          :protocol-icloud-web:assembleDebugAndroidTest testDebugUnitTest
          -Proborazzi.test.${{ steps.screenshots.outputs.mode }}=true
          :app:assembleRelease :benchmark:assembleBenchmark :benchmark:assembleProfile --no-daemon --console=plain
      - name: Lint and static analysis
        if: ${{ !cancelled() }}
        run: ./gradlew lintDebug detekt ktlintCheck --no-daemon --console=plain
      - name: Summarize JVM tests
        if: ${{ !cancelled() }}
        run: >-
          find . -path '*/build/test-results/testDebugUnitTest/*' -name 'TEST-*.xml' -print0
          | xargs -0 node scripts/device_test_summary.mjs "JVM tests" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Verify mode: the new images and their differences from the goldens. Record mode: the new goldens.
          name: screenshots
          path: |
            app/build/outputs/roborazzi/
            app/src/test/screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload JVM test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jvm-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
      - name: Require committed screenshot goldens
        if: ${{ steps.screenshots.outputs.mode == 'record' }}
        run: |
          echo "::error::No screenshot goldens are committed. This run recorded them in the 'screenshots' artifact;"\
            "commit them under app/src/test/screenshots, or run CI with 'record-screenshots' on this branch."
          exit 1

  record-screenshots:
    # Manual: Actions > CI > Run workflow > pick the branch > tick "record-screenshots". Records every golden on Linux,
    # where CI verifies them, and commits the result to that branch.
    name: Record screenshot goldens
    if: github.repository != 'thisislvca/mela-archive' && inputs.record-screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      ALBA_SENTRY_DSN: ''
      ALBA_SENTRY_PROPERTIES: /tmp/alba-ci-no-sentry.properties
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Record goldens
        run: |
          rm -rf app/src/test/screenshots
          ./gradlew :app:testDebugUnitTest --tests '*Screenshots' -Proborazzi.test.record=true --no-daemon --console=plain
      - name: Commit goldens
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A app/src/test/screenshots
          if git diff --cached --quiet; then echo "The goldens are unchanged."; exit 0; fi
          git commit -m 'test: record screenshot goldens on Linux'
          git push origin "HEAD:$BRANCH"
          echo "Committed new goldens to $BRANCH. Commits pushed by Actions do not start CI; push again or re-run it." \
            >> "$GITHUB_STEP_SUMMARY"

  instrumentation:
    # Pull requests run the @Smoke device tests on the Pixel 9 at the target API level. Pushes to main, the nightly
    # schedule and manual runs run every device test there, and the smoke tests on the minimum SDK and a compact phone.
    # Dropping devices from the matrix, rather than skipping a job, keeps the result "Android checks" requires
    # meaningful on pull requests.
    name: ${{ matrix.title }}
    if: github.repository != 'thisislvca/mela-archive' && !inputs.record-screenshots
    runs-on: ubuntu-24.04
    # The test orchestrator starts a fresh instrumentation for each test, which adds a few seconds per test.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"device":"pixel9Api36","suite":"smoke","title":"Android 36 smoke device tests"}]' || '[{"device":"pixel9Api36","suite":"all","title":"Android 36 device tests"},{"device":"pixel9Api30","suite":"smoke","title":"Android 30 smoke device tests"},{"device":"compactApi36","suite":"smoke","title":"Compact phone smoke device tests"}]') }}
    env:
      ALBA_SENTRY_DSN: ''
      ALBA_SENTRY_PROPERTIES: /tmp/alba-ci-no-sentry.properties
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools emulator platforms;android-37.0 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Build test APKs before starting emulators
        id: build-test-apks
        run: >-
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
          :engine:assembleDebugAndroidTest :protocol-icloud-web:assembleDebugAndroidTest
          --max-workers=2 --no-parallel --console=plain
      # Each module runs in its own step so a failure or hang is attributed to it. Later modules still run after an
      # earlier one fails; any failed step fails the job. Each step retries its failed tests once and lists flaky tests
      # in the job summary.
      - name: Run app device tests
        if: ${{ !cancelled() && steps.build-test-apks.outcome == 'success' }}
        run: >-
          bash scripts/ci_device_tests.sh app "${{ matrix.device }}" "${{ matrix.title }} (app)"
          ${{ matrix.suite == 'smoke' && '-Pandroid.testInstrumentationRunnerArguments.annotation=me.lvca.alba.app.testing.Smoke' || '' }}
      # Engine and protocol device tests are few and exercise MediaStore, codecs and the Keystore; they all run.
      - name: Run engine device tests
        if: ${{ !cancelled() && steps.build-test-apks.outcome == 'success' }}
        run: bash scripts/ci_device_tests.sh engine "${{ matrix.device }}" "${{ matrix.title }} (engine)"
      - name: Run protocol-icloud-web device tests
        if: ${{ !cancelled() && steps.build-test-apks.outcome == 'success' }}
        run: bash scripts/ci_device_tests.sh protocol-icloud-web "${{ matrix.device }}" "${{ matrix.title }} (protocol-icloud-web)"
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-device-tests-${{ matrix.device }}
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
            **/build/device-test-attempts/
            **/build/intermediates/managed_device_android_test_additional_output/
          retention-days: 7

  checks:
    name: Android checks
    if: always() && github.repository != 'thisislvca/mela-archive' && !inputs.record-screenshots
    needs: [android, instrumentation]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # instrumentation is a matrix; its result is success only if every device that ran passed.
      - name: Require all checks
        env:
          BUILD_RESULT: ${{ needs.android.result }}
          DEVICE_RESULT: ${{ needs.instrumentation.result }}
        run: test "$BUILD_RESULT" = success && test "$DEVICE_RESULT" = success
